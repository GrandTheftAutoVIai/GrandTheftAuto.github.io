<style>
:root{
  --bg1:#fff1e6; --bg2:#ffd3c2; --ink:#2a0f3d; --muted:#6b4a7d;
  --pink:#e0307a; --orange:#f58a1f; --sun-a:#ff5c8a; --sun-b:#ffb347;
  --panel:rgba(255,255,255,.55); --line:rgba(42,15,61,.18); --ground:#2a0f3d;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#12051f; --bg2:#3a0f4d; --ink:#fff4ea; --muted:#d9b8e6;
    --pink:#ff4f9a; --orange:#ffa53a; --sun-a:#ff3f7f; --sun-b:#ffb347;
    --panel:rgba(18,5,31,.55); --line:rgba(255,244,234,.22); --ground:#080212;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#12051f; --bg2:#3a0f4d; --ink:#fff4ea; --muted:#d9b8e6;
  --pink:#ff4f9a; --orange:#ffa53a; --sun-a:#ff3f7f; --sun-b:#ffb347;
  --panel:rgba(18,5,31,.55); --line:rgba(255,244,234,.22); --ground:#080212;
  color-scheme: dark;
}
html{height:100%}
*{box-sizing:border-box}
body{
  margin:0; min-height:100%; color:var(--ink);
  --ink:#fff6ee; --muted:#e6d3f2; --panel:rgba(30,16,70,.45); --line:rgba(255,255,255,.28);
  background:linear-gradient(180deg,#3f2f86 0%,#7a62b8 45%,#d98ab8 80%,#f0a7b8 100%);
  font-family:'Manrope',system-ui,sans-serif; overflow-x:hidden; position:relative;
}
.sun{
  position:absolute; left:50%; bottom:110px; width:min(70vw,520px); aspect-ratio:1; border-radius:50%;
  transform:translateX(-50%);
  background:linear-gradient(180deg,var(--sun-b),var(--sun-a));
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 18px);
  mask:repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 18px);
  opacity:.9; z-index:0;
}
.ground{position:absolute;left:0;right:0;bottom:0;height:120px;background:var(--ground);z-index:1}
.ground svg{position:absolute;bottom:100%;left:0;width:100%;height:90px;fill:var(--ground)}
main{
  position:relative; z-index:2; min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:48px 20px 260px;
}
h1{
  font-family:'Anton',Impact,sans-serif; font-weight:400; margin:0;
  font-size:clamp(4rem,16vw,10rem); line-height:.95; letter-spacing:.02em;
  color:#fff; text-shadow:0 0 28px rgba(200,180,255,.85);
}
.date{margin:.6rem 0 2.2rem; font-size:clamp(1rem,3vw,1.3rem); color:var(--muted); font-weight:600}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(8px,2vw,20px); width:min(100%,780px)}
.cell{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:clamp(14px,3vw,28px) 6px; backdrop-filter:blur(6px);
}
.num{
  display:block; font-family:'Anton',Impact,sans-serif; font-size:clamp(2.4rem,10vw,5.5rem);
  line-height:1; font-variant-numeric:tabular-nums; color:var(--ink);
}
.lbl{display:block; margin-top:.5rem; font-size:clamp(.75rem,2.4vw,1rem); color:var(--muted); font-weight:600}
.msg{margin-top:2rem; font-size:1.05rem; color:var(--muted); max-width:34ch}
.done h1{animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
@media (prefers-reduced-motion: reduce){.done h1{animation:none}}
.tot{margin-top:1.4rem}
.cap{margin:1.6rem 0 .8rem; font-size:1.05rem; font-weight:600; color:var(--muted)}
.grid.three{grid-template-columns:repeat(3,1fr)}
.tot .num{font-size:clamp(1.3rem,5.4vw,2.6rem)}
.fun{margin-top:1.2rem; width:min(100%,780px)}
.fun .grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fun .cell{padding:16px 10px}
.fnum{display:block; font-family:'Anton',Impact,sans-serif; font-size:clamp(1.6rem,6vw,2.3rem); line-height:1.1; font-variant-numeric:tabular-nums}
.flbl{display:block; margin-top:.4rem; font-size:.9rem; color:var(--muted); font-weight:600}
.actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:1.6rem}
.btn{
  font:inherit; font-weight:600; color:var(--ink); cursor:pointer;
  background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:12px 22px; backdrop-filter:blur(6px); min-height:44px;
}
.btn:hover{border-color:var(--ink)}
:focus-visible{outline:3px solid var(--orange); outline-offset:3px}
</style>

  var nf = new Intl.NumberFormat('fr-FR');

    $('ts').textContent = nf.format(T);
    var nums = funEl.querySelectorAll('.fnum');
    for (var i = 0; i < FUN.length; i++) nums[i].textContent = nf.format(Math.floor(T * FUN[i][2]));
  }
  function tick(){
    var diff = target - Date.now();
    if (diff <= 0){
      document.getElementById('page').classList.add('done');
      $('d').textContent = $('h').textContent = $('m').textContent = $('s').textContent = '00';
      $('msg').textContent = 'C’est le jour J : GTA VI est disponible.';
      render(0);
      return;
    }
    var s = Math.floor(diff / 1000);
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600;
    var m = Math.floor(s / 60); s -= m * 60;

    $('h').textContent = pad(h);
    $('m').textContent = pad(m);
    $('s').textContent = pad(s);
